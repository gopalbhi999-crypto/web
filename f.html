<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Pradeep Cyber Cafe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 30%, #000046 100%);
            min-height: 100vh;
            color: #ffffff;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .contact-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 2px solid #00f2fe;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            color: #fff;
            margin-bottom: 30px;
            border-bottom: 2px solid #ffe600;
            padding-bottom: 10px;
        }

        .info-section {
            margin-bottom: 25px;
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #ffe600;
        }

        .info-title {
            font-size: 1.1rem;
            color: #ffe600;
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-text {
            font-size: 1.1rem;
            color: #fff;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #ffe600;
            color: #000046;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 230, 0, 0.3);
        }

        .btn:hover {
            background: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <h1>Contact & Address</h1>

        <div class="info-section">
            <div class="info-title">📍 Shop Address:</div>
            <div class="info-text">
                Pradeep Cyber Cafe<br>
                Main Bazar, Dibiyapur,<br>
                Auraiya, Uttar Pradesh - 206244
            </div>
        </div>

        <div class="info-section">
            <div class="info-title">📞 Phone Number:</div>
            <div class="info-text">+91 9927228476</div>
        </div>

        <div class="info-section">
            <div class="info-title">✉️ Email Address:</div>
            <div class="info-text">pkushwaha021@gmail.com</div>
        </div>

        <div class="info-section">
            <div class="info-title">⏰ Opening Hours:</div>
            <div class="info-text">Morning 10:00 AM to Evening 08:00 PM</div>
            <div class="info-text">OFF ON SUNDAY'S</div>
        </div>

        <a href="index.html" class="btn">Go Back Home</a>
    </div>

</body>
</html>
