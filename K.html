<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photocopy & Printing Rates - Pradeep Cyber Cafe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Same Beautiful Multi-color Gradient Background */
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 30%, #000046 100%);
            min-height: 100vh;
            color: #ffffff;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
        }

        header h1 {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.3);
            font-weight: 800;
            letter-spacing: 1px;
        }

        header p {
            font-size: 1.2rem;
            color: #ffe600;
            margin-top: 10px;
            font-weight: 600;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }

        .info-title {
            font-size: 1.6rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 3px solid #ffe600;
            padding-bottom: 5px;
        }

        .instruction-text {
            font-size: 1.1rem;
            color: #e0e0e0;
            margin-bottom: 25px;
            text-align: center;
        }

        .price-container {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        /* Price Cards converted into clickable buttons */
        .price-btn-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border: 2px solid #00f2fe;
            border-radius: 15px;
            padding: 22px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        /* Hover effect to make it feel like a premium button */
        .price-btn-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.25);
            border-color: #ffe600;
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.4);
        }

        .price-info {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .price-tag {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffe600;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.3);
        }

        /* Back Button Style */
        .btn-back {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 30px;
            background: transparent;
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            border: 2px solid #ffffff;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: #ffffff;
            color: #000046;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body>

    <header>
        <h1>Pradeep Cyber Cafe</h1>
        <p>🖨️ Photocopy & Printing Services</p>
    </header>

    <h2 class="info-title">Printing Rate List</h2>
    <p class="instruction-text">(रेट पर क्लिक करके सीधे WhatsApp पर ऑर्डर भेजें)</p>

    <div class="price-container">
        <a href="https://wa.me/919927228476?text=Colourless%20Print" target="_blank" class="price-btn-card">
            <div class="price-info">
                <span>📄</span> Colourless (B&W) Print
            </div>
            <div class="price-tag">₹2 / page</div>
        </a>

        <a href="https://wa.me/919927228476?text=Coloured%20Print" target="_blank" class="price-btn-card">
            <div class="price-info">
                <span>🌈</span> Coloured Print
            </div>
            <div class="price-tag">₹10 / page</div>
        </a>
    </div>

    <a href="index.html" class="btn-back">← Go Back</a>

    <footer>
        <p>© 2026 Pradeep Cyber Cafe. All Rights Reserved.</p>
    </footer>

</body>
</html>
